[project]
name = "cc-blackbox"
version = "0.3.0"
description = "Unofficial, not affiliated with or endorsed by Anthropic: typed Python access to Claude Code (cc), its profiles, sessions, transcripts and messaging, through undocumented internals that can change in any release"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Filip Procházka", email = "mr@fprochazka.cz" }
]
requires-python = ">=3.11"
keywords = ["claude-code", "claude", "session", "transcript", "messaging", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/fprochazka/cc-blackbox"
Repository = "https://github.com/fprochazka/cc-blackbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_blackbox"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not perf'"
markers = [
    "live: starts a real headless Claude Code session and spends model usage; run with `pytest -m live -s`",
    "perf: measures wall-clock time against a stdlib baseline; run before a release with `pytest -m perf -s`",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0",
]
