[project]
name = "cc-blackbox"
version = "0.1.0"
description = "Typed Python access to a running Claude Code: profiles, active sessions and cross-session messaging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Filip Procházka", email = "mr@fprochazka.cz" }
]
requires-python = ">=3.11"
keywords = ["claude-code", "claude", "session", "messaging", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/fprochazka/claude-code-blackbox-sdk"
Repository = "https://github.com/fprochazka/claude-code-blackbox-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_blackbox"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0",
]
